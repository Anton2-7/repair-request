<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель мастера</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="./style/master.css">

  
</head>
<body>
    <div class="container">
        <!-- Шапка с пользователем -->
        <div class="user-header" id="user-header">
            <div class="user-info">
                <span>👤 Загрузка...</span>
            </div>
            <div>
                <button class="btn-primary btn-sm" onclick="window.location.href='/create.html'">
                    <span class="btn-icon">➕</span> Новая заявка
                </button>
                <button class="btn-danger btn-sm" onclick="logout()">
                    <span class="btn-icon">🚪</span> Выйти
                </button>
            </div>
        </div>

        <h2>🔧 Панель мастера</h2>

        <!-- Статистика -->
        <div class="stats-card" id="stats-card" style="display: none;">
            <div class="stat-item">
                <span class="stat-label">📋 Всего заявок:</span>
                <span class="stat-value" id="total-count">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">⏳ Ожидают:</span>
                <span class="stat-value" id="assigned-count">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">⚙️ В работе:</span>
                <span class="stat-value" id="progress-count">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">✅ Выполнено:</span>
                <span class="stat-value" id="done-count">0</span>
            </div>
        </div>

        <!-- Фильтр по статусу -->
        <div class="filter-bar">
            <label for="statusFilter">Фильтр по статусу:</label>
            <select id="statusFilter" onchange="applyFilter()" class="filter-select">
                <option value="">Все мои заявки</option>
                <option value="assigned">Назначенные</option>
                <option value="in_progress">В работе</option>
                <option value="done">Выполненные</option>
                <option value="canceled">Отменённые</option>
            </select>
            <button onclick="loadRequests()" class="refresh-btn">
                <span class="btn-icon">🔄</span> Обновить
            </button>
        </div>

        <!-- Контейнер для сообщений -->
        <div id="message-container"></div>

        <!-- Таблица заявок -->
        <div class="table-container">
            <table id="requests-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Клиент</th>
                        <th>Телефон</th>
                        <th>Адрес</th>
                        <th>Проблема</th>
                        <th>Статус</th>
                        <th>Действия</th>
                    </tr>
                </thead>
                <tbody id="requestsBody">
                    <tr><td colspan="7" class="text-center">Загрузка заявок...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

  <script src="./script/master.js"></script>
</body>
</html>
